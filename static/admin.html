<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - AI Smart Notes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <aside id="sidebar">
        <div class="sidebar-header">
            <div class="brand">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="7"></rect>
                    <rect x="14" y="3" width="7" height="7"></rect>
                    <rect x="14" y="14" width="7" height="7"></rect>
                    <rect x="3" y="14" width="7" height="7"></rect>
                </svg>
                Admin Panel
            </div>
        </div>

        <div style="padding: 10px; display: flex; flex-direction: column; gap: 5px;">
            <a href="/" class="nav-item">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                Back to App
            </a>
        </div>

        <div class="logout-btn-container">
            <a href="/logout" class="logout-btn" style="text-decoration: none;">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                Sign Out
            </a>
        </div>
    </aside>

    <main class="admin-main">
        <header class="admin-header">
            <h1>System Overview</h1>
        </header>

        <section class="stats-grid">
            <div class="stat-card">
                <h3>Total Users</h3>
                <div class="value" id="stat-users">-</div>
            </div>
            <div class="stat-card">
                <h3>Total Notes</h3>
                <div class="value" id="stat-notes">-</div>
            </div>
        </section>

        <section class="admin-section">
            <h2>User Management</h2>
            <div class="table-container">
                <table id="users-table">
                    <thead>
                        <tr>
                            <th>Username</th>
                            <th>Role</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Users injected here -->
                    </tbody>
                </table>
            </div>
        </section>

        <section class="admin-section" style="margin-top: 40px;">
            <h2>Application Settings</h2>
            <div
                style="background: var(--glass-bg); padding: 24px; border-radius: 12px; border: 1px solid var(--glass-border);">
                <div class="form-group">
                    <label for="creator-details">Creator Details / Footer Text</label>
                    <textarea id="creator-details" rows="3" placeholder="e.g. Created by John Doe"
                        style="width: 100%; padding: 12px; background: rgba(0,0,0,0.2); border: 1px solid var(--glass-border); border-radius: 8px; color: var(--text-color); margin-bottom: 10px;"></textarea>
                </div>
                <button id="save-settings-btn" class="login-btn" style="width: auto; padding: 10px 24px;">Save
                    Settings</button>
            </div>
        </section>
    </main>

    <script src="admin.js"></script>
</body>

</html>
